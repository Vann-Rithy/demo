name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Upload files via FTP
      uses: appleboy/ftp-action@v0.0.12
      with:
        host: ${{ secrets.FTP_SERVER }}  # e.g., ftp.cgrithy.com
        username: ${{ secrets.FTP_USERNAME }}  # e.g., demo@cgrithy.com
        password: ${{ secrets.FTP_PASSWORD }}  # e.g., G$9!L?fPXVk%
        port: 21
        local-dir: ./
        remote-dir: /home/cgrithy/public_html/cgrithy.com/demo
